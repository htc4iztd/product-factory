server {
  listen 8080;
  root /usr/share/nginx/html;
  # web（Next.js）が /ide/* をここへ中継する。index.html と拡張機能は短く、Code-OSS 本体は長くキャッシュする
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /extensions/ { add_header Cache-Control "no-cache"; }
  location / { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
}
