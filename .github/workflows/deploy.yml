name: deploy
# ci が main で成功したら、イメージを ECR に push し、SSM Run Command で EC2 上の compose を更新する
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: aws-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: build & push
        env:
          PREFIX: ${{ steps.ecr.outputs.registry }}/product-factory
          TAG: ${{ github.sha }}
        run: |
          for svc in agent-api:services/agent web:apps/web; do
            name=${svc%%:*}; ctx=${svc#*:}
            docker build -t $PREFIX/$name:$TAG -t $PREFIX/$name:latest $ctx
            docker push --all-tags $PREFIX/$name
          done
      - name: upload compose bundle
        run: |
          BUCKET=$(aws ssm get-parameter --name /pf/mvp/data_bucket --query Parameter.Value --output text)
          git archive --format=tar.gz -o release.tgz HEAD docker-compose.yml infra/nginx
          aws s3 cp release.tgz s3://$BUCKET/release/${{ github.sha }}.tar.gz
      - name: roll out via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IID=$(aws ssm get-parameter --name /pf/mvp/instance_id --query Parameter.Value --output text)
          CMD_ID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --parameters commands="[\"/opt/pf/deploy.sh $REGISTRY $TAG ${{ github.sha }}\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$IID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}'
          test "$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text)" = Success
