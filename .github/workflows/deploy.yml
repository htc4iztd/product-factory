name: deploy
# ci が main で成功したら、イメージを Artifact Registry に push し、Cloud Run（agent-api → web）を更新する
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  # workflow_run では github.sha が main の最新になるので、ci が検証したコミットを使う
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # GCP の設定（Variables）が入るまではスキップする
    if: vars.GCP_WIF_PROVIDER != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production   # Workload Identity の条件と揃える
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.SHA }}" }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: build & push
        run: |
          REG=$REGION-docker.pkg.dev/$PROJECT/product-factory
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          for svc in agent-api:services/agent web:apps/web; do
            name=${svc%%:*}; ctx=${svc#*:}
            docker build -t $REG/$name:$SHA $ctx
            docker push $REG/$name:$SHA
          done

      # Supabase の接続プール（session モード）は同時接続数に上限があるので、
      # インスタンスは各1台、プールは各2本に抑える（agent は工場DBとADKで2本ずつ）
      - name: deploy agent-api
        env:
          GEMINI: ${{ vars.PF_GEMINI }}
          GH_TOKEN_ON: ${{ vars.PF_GITHUB_TOKEN }}
          PF_MODEL: ${{ vars.PF_MODEL || 'gemini-flash-latest' }}
          PF_IMAGE_MODEL: ${{ vars.PF_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          ADMINS: ${{ vars.PF_ADMIN_EMAILS }}   # 設定画面でアプリ全体の既定を変えられる人（複数は ; 区切り）
        run: |
          SECRETS=DATABASE_URL=DATABASE_URL:latest,PF_INTERNAL_TOKEN=PF_INTERNAL_TOKEN:latest,PF_SECRET_KEY=PF_SECRET_KEY:latest
          # Issue の本文にチケットへのリンクを書くため、web の URL を渡す（初回は空）
          WEB_URL=$(gcloud run services describe pf-web --region $REGION --format 'value(status.url)' 2>/dev/null || true)
          ENVS=PF_DB_POOL_SIZE=2,PF_MODEL=$PF_MODEL,PF_IMAGE_MODEL=$PF_IMAGE_MODEL,GOOGLE_CLOUD_PROJECT=$PROJECT,PF_ADMIN_EMAILS=$ADMINS,PF_WEB_URL=$WEB_URL
          # Gemini を使うのは Variables の PF_GEMINI=true のときだけ。それ以外はスタブ
          if [ "$GEMINI" = "true" ]; then SECRETS=$SECRETS,GOOGLE_API_KEY=GOOGLE_API_KEY:latest; else ENVS=$ENVS,PF_LLM=stub; fi
          # 非公開リポジトリを読むときだけ GITHUB_TOKEN を渡す（Variables の PF_GITHUB_TOKEN=true）
          if [ "$GH_TOKEN_ON" = "true" ]; then SECRETS=$SECRETS,GITHUB_TOKEN=GITHUB_TOKEN:latest; fi
          IMG=$REGION-docker.pkg.dev/$PROJECT/product-factory/agent-api:$SHA
          SA=pf-agent@$PROJECT.iam.gserviceaccount.com
          # 時間のかかる処理（自動開発など）は Cloud Run Jobs で動かす。agent と同じイメージ・設定で、入口だけ worker にする
          gcloud run jobs deploy pf-autodev --region $REGION --image $IMG --service-account $SA \
            --command python --args="-m,pf_agent.worker" --cpu 1 --memory 1Gi --task-timeout 3600 --max-retries 0 \
            --set-env-vars "$ENVS" --set-secrets "$SECRETS"
          # agent がこのジョブを起動・取り消しできるようにする
          gcloud run jobs add-iam-policy-binding pf-autodev --region $REGION \
            --member serviceAccount:$SA --role roles/run.developer >/dev/null
          gcloud run deploy pf-agent --region $REGION --image $IMG \
            --service-account $SA --no-allow-unauthenticated \
            --port 8100 --cpu 1 --memory 1Gi --cpu-boost --timeout 600 --min-instances 0 --max-instances 1 \
            --set-env-vars "$ENVS,PF_JOB_NAME=pf-autodev,PF_JOB_REGION=$REGION" --set-secrets "$SECRETS"

      - name: deploy web
        env:
          ALLOW_SIGNUP: ${{ vars.PF_ALLOW_SIGNUP || 'true' }}
          WEBHOOK_ON: ${{ vars.PF_GITHUB_WEBHOOK }}
        run: |
          # GitHub の webhook を受けるときだけ署名の鍵を渡す（Variables の PF_GITHUB_WEBHOOK=true。Terraform の apply が先）
          HOOK=""; if [ "$WEBHOOK_ON" = "true" ]; then HOOK=",GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest"; fi
          AGENT_URL=$(gcloud run services describe pf-agent --region $REGION --format 'value(status.url)')
          # IDE（ide ワークフローが置く）があれば、その URL を web に渡す
          IDE_URL=$(gcloud run services describe pf-ide --region $REGION --format 'value(status.url)' 2>/dev/null || true)
          gcloud run deploy pf-web --region $REGION --image $REGION-docker.pkg.dev/$PROJECT/product-factory/web:$SHA \
            --service-account pf-web@$PROJECT.iam.gserviceaccount.com --allow-unauthenticated \
            --port 3000 --cpu 1 --memory 512Mi --cpu-boost --timeout 600 --min-instances 0 --max-instances 1 \
            --set-env-vars "AGENT_API_URL=$AGENT_URL,AGENT_AUTH=google-id-token,PF_DB_POOL_SIZE=2,PF_ALLOW_SIGNUP=$ALLOW_SIGNUP,IDE_ORIGIN=$IDE_URL" \
            --set-secrets AUTH_SECRET=AUTH_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,PF_INTERNAL_TOKEN=PF_INTERNAL_TOKEN:latest$HOOK
          echo "web: $(gcloud run services describe pf-web --region $REGION --format 'value(status.url)')" >> $GITHUB_STEP_SUMMARY
