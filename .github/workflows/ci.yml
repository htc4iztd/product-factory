name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/agent } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check pf_agent tests
      - run: pytest -q          # Postgres での通しは e2e ジョブ（compose）で見る
        env: { PF_LLM: stub }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env: { AUTH_SECRET: ci-only, DATABASE_URL: "postgresql://x@localhost/x" }

  e2e:
    needs: [agent, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: compose up
        run: |
          printf 'AUTH_SECRET=ci\nPF_INTERNAL_TOKEN=ci\nPF_LLM=stub\nPF_HTTP_PORT=8080\nAUTH_URL=http://localhost:8080\n' > .env
          docker compose up -d --build --wait
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: playwright full cycle (P0–P5 をダミー入力で通す)
        working-directory: apps/web
        run: |
          npm i --no-save playwright@1 && npx playwright install --with-deps chromium
          BASE=http://localhost:8080 node e2e/full-cycle.mjs
      - if: failure()
        run: docker compose logs --tail=200
