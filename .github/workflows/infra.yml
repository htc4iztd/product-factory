name: infra
# PR では plan を出し、main への push では environment "aws-mvp" の承認後に apply する
on:
  pull_request:
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_DIR: infra/terraform/envs/mvp
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

jobs:
  plan:
    # AWS の設定（Variables）が入るまではスキップする
    if: github.event_name == 'pull_request' && vars.AWS_TF_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_TF_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=$TF_DIR init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=$TF_DIR validate
      - run: terraform -chdir=$TF_DIR plan -no-color -var "github_repo=${{ github.repository }}"

  apply:
    if: github.event_name != 'pull_request' && vars.AWS_TF_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: aws-mvp      # Required reviewers をここに設定する
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_TF_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=$TF_DIR init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=$TF_DIR apply -auto-approve -var "github_repo=${{ github.repository }}"
